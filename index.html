<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>東京まちづくり — Proto</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- —— Title —— -->
    <section id="screen-title" class="screen active">
      <div class="title-bg" aria-hidden="true"></div>
      <div class="skyline" aria-hidden="true"></div>
      <div class="neon-glow" aria-hidden="true"></div>
      <div class="title-card">
        <p class="eyebrow">ビジュアルノベル × VV</p>
        <h1>東京まちづくり</h1>
        <p class="subtitle">日常業務の駆け引き法分来な安全業務家</p>
        <p class="pitch">信頼をてげない。エアコンは熱く、コンペとキャンペーンは熱い。\nそして、東京の入口で君は選ぶ。いま、その選択が未来を決める。</p>
        <button type="button" id="btn-start" class="btn primary">はじめる</button>
        <p class="hint">クリックで進む。エアコンで選択できる。キーボードでも進める。</p>
      </div>
    </section>

    <!-- —— Game —— -->
    <section id="screen-play" class="screen" hidden>
      <div class="hud" aria-label="ステータス">
        <div class="stat" data-stat="money">
          <span class="stat-label">資金</span>
          <span class="stat-value" id="stat-money">50</span>
        </div>
        <div class="stat" data-stat="trust">
          <span class="stat-label">信頼</span>
          <span class="stat-value" id="stat-trust">50</span>
        </div>
        <div class="stat" data-stat="buzz">
          <span class="stat-label">バズ</span>
          <span class="stat-value" id="stat-buzz">20</span>
        </div>
      </div>

      <div class="scene-panel">
        <div class="scene-art" aria-hidden="true"></div>
        <span class="scene-label" id="scene-label"></span>
      </div>

      <div class="dialogue-box" id="dialogue-box" role="button" tabindex="0" aria-label="クリックで進むダイアログ">
        <div class="speaker" id="speaker"></div>
        <p class="text" id="dialogue-text"></p>
        <span class="continue-hint" id="continue-hint">▼ 続きを読む</span>
      </div>

      <div class="choices" id="choices" hidden></div>
    </section>

    <!-- —— Ending —— -->
    <section id="screen-ending" class="screen" hidden>
      <div class="ending-card" id="ending-card">
        <div class="ending-art" aria-hidden="true"></div>
        <p class="ending-tag" id="ending-tag"></p>
        <h2 id="ending-title"></h2>
        <p class="ending-body" id="ending-body"></p>
        <div class="ending-stats" id="ending-stats"></div>
        <button type="button" id="btn-restart" class="btn primary">タイトルへ</button>
      </div>
    </section>

    <div class="toast" id="fx-toast" hidden></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
